<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Pokédachi Life: Tomodachi Life where every islander is a Pokémon">
  <style>
    .bob { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bob2 { animation: bob 3.8s ease-in-out -1.4s infinite; transform-box: fill-box; transform-origin: center; }
    .bounce { animation: bounce 1.6s cubic-bezier(.5,0,.5,1) infinite; transform-box: fill-box; transform-origin: center bottom; }
    .shadow { animation: squash 1.6s cubic-bezier(.5,0,.5,1) infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .t2 { animation-delay: -0.8s; } .t3 { animation-delay: -1.6s; } .t4 { animation-delay: -0.4s; }
    .wave { animation: wave 6s linear infinite; }
    .cloud { animation: drift 40s linear infinite; }
    .cloud2 { animation: drift 55s linear -20s infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes bounce { 0%,100% { transform: translateY(0) scale(1.06,.94) } 12% { transform: translateY(0) scale(1,1) } 50% { transform: translateY(-70px) } 88% { transform: translateY(0) scale(1,1) } }
    @keyframes squash { 0%,100% { transform: scale(1.15); opacity: .35 } 50% { transform: scale(.55); opacity: .15 } }
    @keyframes twinkle { 0%,100% { transform: scale(.4) rotate(0deg); opacity: .2 } 50% { transform: scale(1) rotate(45deg); opacity: 1 } }
    @keyframes wave { from { transform: translateX(0) } to { transform: translateX(-160px) } }
    @keyframes drift { from { transform: translateX(-260px) } to { transform: translateX(1400px) } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset=".55" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffc94d"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54c8f5"/>
      <stop offset="1" stop-color="#1d8fd8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#e8364b"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="13" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="5"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#sky)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <!-- clouds -->
    <g class="cloud" fill="#ffffff" opacity=".85">
      <ellipse cx="0" cy="70" rx="70" ry="26"/><ellipse cx="45" cy="56" rx="48" ry="30"/><ellipse cx="-40" cy="62" rx="40" ry="22"/>
    </g>
    <g class="cloud2" fill="#ffffff" opacity=".7">
      <ellipse cx="0" cy="150" rx="56" ry="20"/><ellipse cx="32" cy="138" rx="36" ry="24"/>
    </g>
    <!-- sea + island -->
    <g class="wave">
      <path d="M0 360 q40 -18 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 V420 H0 Z" fill="url(#sea)"/>
    </g>
    <path d="M820 368 C850 300 930 268 1040 270 C1150 272 1230 300 1262 368 Z" fill="#8fd16a"/>
    <path d="M840 368 C880 318 950 300 1040 300 C1130 300 1200 320 1240 368 Z" fill="#6cbd4e"/>
    <path d="M800 372 C900 352 1180 352 1280 372 L1280 386 L800 386 Z" fill="#f7dc9c"/>
    <!-- apartment block -->
    <g transform="translate(985 196)">
      <rect x="0" y="0" width="110" height="88" rx="6" fill="#f4f1ea" stroke="#c9c1ad" stroke-width="3"/>
      <rect x="-6" y="-12" width="122" height="16" rx="6" fill="#2f8fd8"/>
      <g fill="#ffe27a" stroke="#c9c1ad" stroke-width="2">
        <rect x="12" y="14" width="18" height="16" rx="2"/><rect x="46" y="14" width="18" height="16" rx="2" fill="#9ed8f5"/><rect x="80" y="14" width="18" height="16" rx="2"/>
        <rect x="12" y="44" width="18" height="16" rx="2" fill="#9ed8f5"/><rect x="46" y="44" width="18" height="16" rx="2"/><rect x="80" y="44" width="18" height="16" rx="2" fill="#9ed8f5"/>
      </g>
      <rect x="44" y="66" width="22" height="22" rx="3" fill="#2f8fd8"/>
    </g>
    <!-- bouncing ball -->
    <ellipse class="shadow" cx="1140" cy="352" rx="30" ry="7" fill="#1b4f7a"/>
    <g class="bounce">
      <circle cx="1140" cy="318" r="32" fill="#ffffff" stroke="#2b2b2b" stroke-width="5"/>
      <path d="M1108 318 A32 32 0 0 1 1172 318 Z" fill="#ef3e4a" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round"/>
      <line x1="1108" y1="318" x2="1172" y2="318" stroke="#2b2b2b" stroke-width="6"/>
      <circle cx="1140" cy="318" r="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="5"/>
      <ellipse cx="1126" cy="302" rx="7" ry="4" fill="#ffffff" opacity=".55"/>
    </g>
    <!-- speech bubble -->
    <g transform="translate(-130 -46)"><g class="bob2">
      <path d="M842 150 h214 a22 22 0 0 1 22 22 v44 a22 22 0 0 1 -22 22 h-130 l-26 26 l2 -26 h-60 a22 22 0 0 1 -22 -22 v-44 a22 22 0 0 1 22 -22 z" fill="#ffffff" stroke="#f0a020" stroke-width="5"/>
      <text x="949" y="204" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="27" font-weight="700" fill="#5a3a12">Who's moving in?</text>
    </g></g>
    <!-- sparkles -->
    <g fill="#ffffff">
      <path class="twinkle" d="M120 300 l6 -18 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 z"/>
      <path class="twinkle t2" d="M745 70 l5 -14 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 z"/>
      <path class="twinkle t3" d="M640 330 l4 -12 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 z"/>
      <path class="twinkle t4" d="M1210 120 l5 -14 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 z"/>
    </g>
    <!-- title -->
    <g class="bob">
      <text x="72" y="190" font-family="'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="104" font-weight="900" fill="#ffffff" stroke="#ffffff" stroke-width="26" stroke-linejoin="round">Pokédachi</text>
      <text x="72" y="190" font-family="'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="104" font-weight="900" fill="url(#title)" stroke="#8a1f2c" stroke-width="4" stroke-linejoin="round">Pokédachi</text>
      <text x="78" y="262" font-family="'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="64" font-weight="900" fill="#ffffff" stroke="#ffffff" stroke-width="20" stroke-linejoin="round">Life</text>
      <text x="78" y="262" font-family="'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="64" font-weight="900" fill="#2f8fd8" stroke="#164a73" stroke-width="3" stroke-linejoin="round">Life</text>
    </g>
    <text x="80" y="318" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="26" font-weight="700" fill="#6b4410">Tomodachi Life × Pokémon Rumble Blast</text>
    <text x="80" y="352" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="22" fill="#6b4410">717 Pokémon are ready to move in</text>
  </g>
</svg>
